<title>플라밍고 대군단 — Flamingo Gate Defense</title>
<style>

    --pink:#ff5c9e; --pink-deep:#e8437f; --cream:#fff6ea; --ink:#3a2b3f;
    --blue:#3fa9ff; --red:#ff4d5e; --cyan:#39d6d0;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#ffd9b3;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #app{ position:fixed; inset:0; touch-action:none; }
  canvas{ display:block; }

  #ui{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }

  /* ---------- HUD ---------- */
  #hud{ position:absolute; top:12px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:2px;

  #hud.show{ opacity:1; }
  #score{ font-size:min(9vw,44px); font-weight:900; color:#fff; letter-spacing:1px;

  #subScore{ font-size:min(3.6vw,15px); font-weight:700; color:#fff; opacity:.95;
    text-shadow:0 2px 6px rgba(0,0,0,.3); }
  #best{ font-size:min(3.4vw,14px); font-weight:800; color:#ffe98a; text-shadow:0 2px 6px rgba(0,0,0,.35); margin-top:2px; }

  /* ---------- floating count labels ---------- */
  .count-label{ position:absolute; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none;
    font-weight:900; white-space:nowrap; will-change:left,top; }
  #flockLabel{ font-size:min(8vw,36px); color:#fff; padding:2px 16px; border-radius:22px;
    background:linear-gradient(180deg, rgba(63,169,255,.92), rgba(35,120,220,.92));
    box-shadow:0 4px 12px rgba(20,80,160,.35), inset 0 2px 0 rgba(255,255,255,.4);
    text-shadow:0 2px 0 rgba(0,60,140,.4); transition:transform .12s ease-out; font-variant-numeric:tabular-nums; }
  #flockLabel.pop{ transform:translate(-50%,-100%) scale(1.35); }
  #flockLabel.pop-bad{ transform:translate(-50%,-100%) scale(.78); background:linear-gradient(180deg,rgba(255,77,94,.92),rgba(200,40,60,.92)); }
  .enemy-label{ font-size:min(6.5vw,30px); color:#fff; padding:1px 14px; border-radius:20px;
    background:linear-gradient(180deg, rgba(255,77,94,.92), rgba(196,32,52,.92));
    box-shadow:0 4px 12px rgba(150,20,40,.35), inset 0 2px 0 rgba(255,255,255,.35);
    text-shadow:0 2px 0 rgba(120,0,20,.4); display:none; font-variant-numeric:tabular-nums; }
  .enemy-label.boss{ font-size:min(9vw,42px); padding:3px 20px; border-radius:26px;
    background:linear-gradient(180deg, rgba(140,40,220,.94), rgba(90,15,160,.94));

  /* op toast */
  #opToast{ position:absolute; transform:translate(-50%,-50%); font-size:min(10vw,46px); font-weight:900;

  /* ---------- title ---------- */

  #over .newbest{ display:none; font-size:min(4.4vw,17px); font-weight:900; color:#fff; background:linear-gradient(90deg,#ffb43a,#ff7e2e);

<script type="module">
import * as THREE from 'three';

/* ============================================================
   유틸
============================================================ */
const qs = new URLSearchParams(location.search);
const SCENARIO = qs.get('scenario') || '';
const AUTOSTART = qs.has('autostart') || !!SCENARIO;
const FREEZE = qs.has('freeze');
const BOT = qs.has('bot');
const SIMSEC = parseFloat(qs.get('simsec')||'0') || 0;

const rand  = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b+1));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const fmt   = n=>Math.round(n).toLocaleString('ko-KR');
const pick  = arr=>arr[Math.floor(Math.random()*arr.length)];

const BEST_KEY = 'flamingo-gate-defense-best';
const MUTE_KEY = 'flamingo-gate-defense-muted';

/* ============================================================
   웹오디오 신스 사운드
============================================================ */
const SFX = {
  ctx:null, master:null, noiseBuf:null,
  muted: localStorage.getItem(MUTE_KEY)==='1',
  ensure(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); return; }
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){ /* headless 등 오디오 불가 환경 */ }
  },
  ok(){ return this.ctx && this.ctx.state==='running' && !this.muted; },
  setMuted(m){
    this.muted = m; localStorage.setItem(MUTE_KEY, m?'1':'0');
    if(this.master) this.master.gain.value = m?0:0.5;
  },
  tone(freq, dur, type='sine', vol=0.3, slideTo=null, delay=0){
    if(!this.ok()) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.05);
  },
  noise(dur, vol=0.4, freq=800, q=1, delay=0){
    if(!this.ok()) return;
    const t0 = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; f.Q.value=q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t0); s.stop(t0+dur+0.05);
  },
  gate(good, ratio){
    if(good){
      const base = 660 + clamp(ratio,1,3)*220;   // 좋을수록 높은 음
      this.tone(base, .14, 'sine', .3);
      this.tone(base*1.5, .22, 'sine', .26, null, .07);
      this.tone(base*2, .3, 'triangle', .12, null, .12);
    }else{
      this.tone(300, .2, 'sawtooth', .22, 170);
      this.tone(150, .3, 'square', .12, 90, .05);
    }
  },
  clash(){
    this.noise(.7, .5, 420, 1.2);
    this.tone(70, .6, 'sawtooth', .35, 42);
    this.tone(52, .8, 'sine', .4, 30);
  },
  tick(){ this.tone(rand(1700,2300), .04, 'square', .07); },
  win(){
    this.tone(523, .12, 'square', .2);
    this.tone(659, .12, 'square', .2, null, .1);
    this.tone(784, .25, 'square', .22, null, .2);
  },
  defeat(){
    this.tone(392, .3, 'sawtooth', .3, 370);
    this.tone(311, .3, 'sawtooth', .3, 290, .28);
    this.tone(233, .8, 'sawtooth', .32, 110, .56);
  },
  horn(){
    this.tone(98, 1.1, 'sawtooth', .3, 92);
    this.tone(147, 1.1, 'sawtooth', .2, 139, .05);
    this.noise(1, .12, 300, 1, .05);
  },
  confetti(){
    for(let i=0;i<6;i++) this.tone(700+i*180, .1, 'triangle', .14, null, i*.05);
    this.tone(1046, .5, 'sine', .18, null, .3);
  }
};

/* ============================================================
   렌더러 · 씬 · 카메라
============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffd2ae, 42, 175);

// 하늘 그라데이션 (피치 → 시안)
{
  const c = document.createElement('canvas'); c.width=2; c.height=512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0.00,'#5fd4ff');
  gr.addColorStop(0.42,'#a9ecff');
  gr.addColorStop(0.62,'#ffe3bc');
  gr.addColorStop(0.78,'#ffc79b');
  gr.addColorStop(1.00,'#ffb48d');
  g.fillStyle=gr; g.fillRect(0,0,2,512);

const BASE_FOV = 58;
const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth/window.innerHeight, 0.1, 420);
camera.position.set(0, 6.8, 10.4);

scene.add(new THREE.HemisphereLight(0xcaf4ff, 0xffd9c0, 1.05));

/* ============================================================
   지오메트리 빌더 (버텍스 컬러 로우폴리)
============================================================ */
const M4 = new THREE.Matrix4(), Q4 = new THREE.Quaternion(), E3 = new THREE.Euler(), V3A = new THREE.Vector3();
function part(geo, color, x=0,y=0,z=0, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1){
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  geo.dispose();
  M4.compose(V3A.set(x,y,z), Q4.setFromEuler(E3.set(rx,ry,rz)), new THREE.Vector3(sx,sy,sz));
  g.applyMatrix4(M4);
  const c = new THREE.Color(color);
  const n = g.attributes.position.count;
  const cols = new Float32Array(n*3);
  for(let i=0;i<n;i++){ cols[i*3]=c.r; cols[i*3+1]=c.g; cols[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(cols,3));
  return g;
}
function mergeParts(parts){
  let total=0; for(const p of parts) total += p.attributes.position.count;
  const pos = new Float32Array(total*3), nor = new Float32Array(total*3), col = new Float32Array(total*3);
  let o=0;
  for(const p of parts){
    pos.set(p.attributes.position.array, o*3);
    nor.set(p.attributes.normal.array, o*3);
    col.set(p.attributes.color.array, o*3);
    o += p.attributes.position.count;
    p.dispose();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  g.setAttribute('color',    new THREE.BufferAttribute(col,3));
  return g;
}
const crowdMat = new THREE.MeshLambertMaterial({ vertexColors:true });

// --- 플라밍고 (전방 -z)
function buildFlamingo(crowned){
  const BODY='#ff85b3', WING='#f2669c', LEG='#f08bab', BEAK_B='#ffe3ec', BEAK_T='#42304a', HEAD='#ff8fb9';
  const p = [
    part(new THREE.CylinderGeometry(.028,.028,.42,5), LEG, -.08,.21,.04),
    part(new THREE.CylinderGeometry(.028,.028,.42,5), LEG,  .08,.21,-.02),
    part(new THREE.SphereGeometry(.24,10,8), BODY, 0,.55,0, 0,0,0, 1,.82,1.22),
    part(new THREE.SphereGeometry(.14,8,6), WING, -.19,.58,.02, 0,0,.4, .55,.85,1.15),
    part(new THREE.SphereGeometry(.14,8,6), WING,  .19,.58,.02, 0,0,-.4, .55,.85,1.15),
    part(new THREE.SphereGeometry(.11,8,6), WING, 0,.62,.26, .5,0,0, .7,.8,1),           // 꼬리깃
    part(new THREE.CylinderGeometry(.048,.058,.42,6), HEAD, 0,.8,-.22, .5,0,0),          // 목
    part(new THREE.SphereGeometry(.105,8,7), HEAD, 0,1.0,-.32),
    part(new THREE.CylinderGeometry(.04,.055,.11,6), BEAK_B, 0,.985,-.43, 1.35,0,0),
    part(new THREE.ConeGeometry(.04,.11,6), BEAK_T, 0,.93,-.49, -2.5,0,0),
  ];
  if(crowned){
    p.push(part(new THREE.ConeGeometry(.075,.12,5), '#ffd23e', 0,1.15,-.31));
    p.push(part(new THREE.SphereGeometry(.03,6,5), '#ffd23e', 0,1.22,-.31));
  }
  return mergeParts(p);
}

// --- 적: 악어 (전방 +z)
function buildCroc(){
  const BODY='#3fae57', DARK='#2e8b46', BELLY='#8fdc9c', EYE='#fff7e0';
  const p = [
    part(new THREE.SphereGeometry(.3,9,7), BODY, 0,.32,0, 0,0,0, .9,.62,1.5),
    part(new THREE.SphereGeometry(.17,8,6), BODY, 0,.34,.5, 0,0,0, .82,.6,1.3),           // 주둥이
    part(new THREE.SphereGeometry(.16,7,5), DARK, 0,.3,-.52, .3,0,0, .7,.5,1.2),          // 꼬리
    part(new THREE.ConeGeometry(.09,.22,5), DARK, 0,.32,-.78, -1.9,0,0),
    part(new THREE.ConeGeometry(.07,.14,4), DARK, 0,.55,-.1, -.4,0,0),                     // 등 돌기
    part(new THREE.ConeGeometry(.06,.12,4), DARK, 0,.53,-.32, -.5,0,0),
    part(new THREE.SphereGeometry(.05,6,5), EYE, -.11,.47,.32),
    part(new THREE.SphereGeometry(.05,6,5), EYE,  .11,.47,.32),
    part(new THREE.SphereGeometry(.026,5,4), '#26212b', -.11,.475,.36),
    part(new THREE.SphereGeometry(.026,5,4), '#26212b',  .11,.475,.36),
    part(new THREE.CylinderGeometry(.06,.07,.2,5), BELLY, -.2,.1,.3),
    part(new THREE.CylinderGeometry(.06,.07,.2,5), BELLY,  .2,.1,.3),
    part(new THREE.CylinderGeometry(.06,.07,.2,5), BELLY, -.2,.1,-.3),
    part(new THREE.CylinderGeometry(.06,.07,.2,5), BELLY,  .2,.1,-.3),
  ];
  return mergeParts(p);
}

// --- 적: 하이에나
function buildHyena(){

function buildPalm(){
  const TRUNK='#c98a5b', LEAF='#3ecf6e', LEAF2='#2eb75c', NUT='#8a5a34';
  const p = [ part(new THREE.CylinderGeometry(.14,.22,2.7,6), TRUNK, 0,1.35,0, .08,0,.06) ];
  // 잎: 바깥으로 눕힌 콘

    const g = part(new THREE.ConeGeometry(.3,2.1,4), i%2?LEAF:LEAF2, 0,1.0,0, 0,0,0, 1.3,.9,.4);

    M4.makeRotationY(a); g.applyMatrix4(M4);

function drawGatePanel(canvas, label, good){

// 게이트 연산
function opLabel(op){
  if(op.t==='add') return '+'+op.n;
  if(op.t==='sub') return '−'+op.n;
  if(op.t==='mul') return '×'+op.n;
  return '÷'+op.n;
}
function opGood(op){ return op.t==='add' || op.t==='mul'; }
function applyOp(op, c){
  if(op.t==='add') return c + op.n;
  if(op.t==='sub') return Math.max(0, c - op.n);
  if(op.t==='mul') return c * op.n;
  return Math.max(1, Math.ceil(c / op.n));
}
function opValue(op, c){ return applyOp(op, c) - c; }

function genOpPair(diff, forceGood){
  const addN = ()=>randi(4 + Math.floor(diff*3), 11 + Math.floor(diff*12));
  const subN = ()=>randi(4, 8 + Math.floor(diff*9));
  const goodOp = ()=> (Math.random()<0.62 ? {t:'add', n:addN()} : {t:'mul', n:(Math.random()<0.8?2:3)});
  const badOp  = ()=> (Math.random()<0.72 ? {t:'sub', n:subN()} : {t:'div', n:2});
  let a, b;
  const roll = Math.random();
  if(forceGood || roll < 0.58){ a = goodOp(); b = badOp(); }          // 좋음 vs 나쁨
  else if(roll < 0.83){ a = goodOp(); b = goodOp();                    // 둘 다 좋음(차이 나게)
    for(let k=0;k<4 && opLabel(a)===opLabel(b);k++) b = goodOp();
  } else { a = badOp(); b = badOp();                                    // 둘 다 나쁨! 덜 나쁜 걸 고르자
    for(let k=0;k<4 && opLabel(a)===opLabel(b);k++) b = badOp();
  }
  return Math.random()<0.5 ? [a,b] : [b,a];
}

function spawnGate(z, forceGood){
  const gate = gatePool.find(x=>!x.active);
  if(!gate) return;
  const ops = genOpPair(G.diff, forceGood);
  for(let s=0;s<2;s++){
    const p = gate.panels[s];
    p.op = ops[s]; p.flash = 0;
    const good = opGood(p.op);
    drawGatePanel(p.canvas, opLabel(p.op), good);
    p.tex.needsUpdate = true;
    p.glow.material.map = good ? glowBlue : glowRed;
    p.glow.material.opacity = 0.75;
    p.sub.scale.setScalar(1);
  }
  gate.grp.position.set(0, 0, z);
  gate.grp.visible = true;
  gate.active = true; gate.passed = false; gate.prevZ = z;
}

function waveCount(){ // 이번 웨이브 적 수
  const base = 6 + G.wavesSpawned*4 + G.distance*0.04;
  return Math.max(5, Math.round(base * rand(0.82,1.18)));
}

function spawnWave(z, opts={}){
  const w = wavePool.find(x=>!x.active);
  if(!w) return null;
  w.active = true;
  w.boss = !!opts.boss;
  w.type = opts.type!==undefined ? opts.type : randi(0, ENEMY_TYPES.length-1);
  w.count = opts.count!==undefined ? opts.count : (w.boss ? Math.round(waveCount()*2.0) : waveCount());
  w.startCount = w.count;
  w.z = z; w.prevZ = z;
  w.x = w.boss ? 0 : rand(-1.2, 1.2);
  w.hornPlayed = false;
  w.label = acquireLabel(w.boss);
  if(w.boss){
    const bm = bossMeshes[w.type];
    bm.visible = true;
    bm.position.set(0, 0, z);
  }else{
    w.meshes[w.type].visible = true;
  }
  return w;
}
function despawnWave(w){
  w.active = false;
  for(const m of w.meshes){ m.visible=false; }
  bossMeshes.forEach(m=>m.visible=false);
  if(w.label){ releaseLabel(w.label); w.label=null; }
}

const dotTex = (()=>{ // 부드러운 원형 파티클 텍스처
  const c = document.createElement('canvas'); c.width=c.height=64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,2,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.55,'rgba(255,255,255,.85)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
function makePoints(n, size, opacity){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3), col = new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3+1] = -999; }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const m = new THREE.PointsMaterial({ size, vertexColors:true, transparent:true, opacity, depthWrite:false, sizeAttenuation:true, map:dotTex });
  const pts = new THREE.Points(g,m);
  pts.frustumCulled = false;
  scene.add(pts);
  return { pts, pos:g.attributes.position, col:g.attributes.color,
    vel:new Float32Array(n*3), life:new Float32Array(n), n, cursor:0 };
}
const puff = makePoints(220, 0.34, 0.9);
const confetti = makePoints(300, 0.22, 1);

function spawnPuff(x,y,z, count, cr,cg,cb){
  for(let i=0;i<count;i++){
    const k = puff.cursor = (puff.cursor+1)%puff.n;
    puff.pos.setXYZ(k, x+rand(-.5,.5), y+rand(0,.7), z+rand(-.5,.5));
    puff.vel[k*3]=rand(-2,2); puff.vel[k*3+1]=rand(1.5,4.5); puff.vel[k*3+2]=rand(-2,2);
    puff.life[k]=rand(.4,.8);
    const t = rand(.8,1);
    puff.col.setXYZ(k, cr*t, cg*t, cb*t);
  }
}
const confColor = new THREE.Color();
function spawnConfetti(x,y,z, count){
  for(let i=0;i<count;i++){
    const k = confetti.cursor = (confetti.cursor+1)%confetti.n;
    confetti.pos.setXYZ(k, x+rand(-1,1), y+rand(0,2), z+rand(-1,1));
    confetti.vel[k*3]=rand(-5,5); confetti.vel[k*3+1]=rand(4,11); confetti.vel[k*3+2]=rand(-5,5);
    confetti.life[k]=rand(1,1.9);
    confColor.setHSL(Math.random(), .9, .6);
    confetti.col.setXYZ(k, confColor.r, confColor.g, confColor.b);
  }
}
function updatePoints(P, dt, grav){
  const arr = P.pos.array, vel = P.vel;
  for(let i=0;i<P.n;i++){
    if(P.life[i]<=0) continue;
    P.life[i]-=dt;
    if(P.life[i]<=0){ arr[i*3+1]=-999; continue; }
    arr[i*3]+=vel[i*3]*dt; arr[i*3+1]+=vel[i*3+1]*dt; arr[i*3+2]+=vel[i*3+2]*dt;
    vel[i*3+1]-=grav*dt;
  }
  P.pos.needsUpdate = true;
  P.col.needsUpdate = true;
}

let tickSfxAcc = 0;
function startClash(wave){
  G.clash = { wave, acc:0 };
  G.slowmoT = 0.3;
  G.shake = Math.min(1, 0.45 + wave.count*0.001);
  SFX.clash();
  el.flash.style.transition = 'none';
  el.flash.style.opacity = '1';
  requestAnimationFrame(()=>{
    el.flash.style.transition = 'opacity .6s';
    el.flash.style.opacity = '0';
  });
  const et = ENEMY_TYPES[wave.type];
  spawnPuff(wave.x, 1, wave.z, 26, 1,1,1);
  spawnDebris(0, 1, -1, 0xff85b3, 4);
  spawnDebris(wave.x, 1, wave.z, et.color, 4);
}
function updateClash(dt){
  const c = G.clash, w = c.wave;
  // 1:1 소멸 틱
  const rate = Math.max(26, Math.min(G.count, w.count) * 1.5);
  c.acc += rate * dt;
  let kills = Math.floor(c.acc);
  if(kills>0){
    c.acc -= kills;
    kills = Math.min(kills, w.count, G.count);
    w.count -= kills; G.count -= kills;
    const et = ENEMY_TYPES[w.type];
    spawnPuff(rand(-1,1)*1.2 + w.x*0.4, 1, rand(-2.5,0.5), Math.min(kills,5)+2, 1,.85,.9);
    if(Math.random()<0.6) spawnDebris(rand(-1.5,1.5), .8, rand(-2,0), Math.random()<.5 ? 0xff85b3 : et.color, Math.min(kills,3));
    tickSfxAcc += kills;
    if(tickSfxAcc >= 4){ tickSfxAcc = 0; SFX.tick(); }
    G.shake = Math.max(G.shake, 0.25);
  }
  if(G.count <= 0){
    despawnWave(w); G.clash = null;
    gameOver(w.boss ? ENEMY_TYPES[w.type].kr+' 보스에게 당했습니다…' : ENEMY_TYPES[w.type].kr+' 무리에 막혔습니다…');
    return;
  }
  if(w.count <= 0){
    // 승리!
    const wasBoss = w.boss, bx=w.x, bz=w.z, btype=w.type;
    despawnWave(w); G.clash = null;
    G.wavesCleared++;
    if(wasBoss){
      spawnConfetti(bx, 2.5, bz, 200);
      SFX.confetti();
      G.shake = Math.max(G.shake, 0.7);
    }else{
      spawnPuff(bx, 1.4, bz, 20, 1,.95,.7);
      SFX.win();
    }
  }
}

   메인 루프
============================================================ */
const camLook = new THREE.Vector3();
let elapsed = 0;

function simulate(dt){
  elapsed += dt;
  // 슬로모
  if(G.slowmoT > 0){
    G.slowmoT -= dt;
    G.timeScale = G.debugSlowClash && G.clash ? 0.06 : 0.25;
  }else if(G.debugSlowClash && G.clash){
    G.timeScale = 0.06;
  }else{
    G.timeScale = lerp(G.timeScale, 1, Math.min(1, dt*6));
  }
  const ts = G.timeScale;
  const sdt = dt * ts;

  if(G.mode==='run'){
    // 키보드 조향
    let kd = 0;
    if(keys['ArrowLeft']||keys['KeyA']) kd -= 1;
    if(keys['ArrowRight']||keys['KeyD']) kd += 1;
    if(kd) G.targetX = clamp(G.targetX + kd * 8.5 * dt, -3.4, 3.4);
    // 디버그 봇: 더 나은 관문 쪽으로 자동 조향
    if(BOT && !G.clash){
      let nearest = null;
      for(const g of gatePool){
        if(!g.active || g.passed) continue;
        if(!nearest || g.grp.position.z > nearest.grp.position.z) nearest = g;
      }
      if(nearest){
        const v0 = opValue(nearest.panels[0].op, G.count);
        const v1 = opValue(nearest.panels[1].op, G.count);
        G.targetX = v0 >= v1 ? -GATE_X : GATE_X;
      }
    }
    G.flockX = lerp(G.flockX, G.targetX, Math.min(1, dt*9));

    // 난이도 · 속도
    G.diff = G.distance / 380;
    G.speed = Math.min(30, 13 + G.distance * 0.02);
    const worldSpeed = G.clash ? 0 : G.speed;
    const move = worldSpeed * sdt;
    G.distance += move;

    // 스폰
    if(G.distance >= G.nextSpawnDist){
      spawnSlot(SPAWN_Z);
      G.nextSpawnDist += slotGap();
    }

    // ---- 게이트 이동/판정
    for(const g of gatePool){
      if(!g.active) continue;
      g.prevZ = g.grp.position.z;
      g.grp.position.z += move;
      const z = g.grp.position.z;
      if(!g.passed && g.prevZ < 0 && z >= 0){
        g.passed = true;
        const side = G.flockX < 0 ? 0 : 1;
        const p = g.panels[side];
        const before = G.count;
        G.count = applyOp(p.op, G.count);
        const good = G.count >= before;
        const ratio = before>0 ? G.count/Math.max(1,before) : 1;
        p.flash = 0.35;
        popFlockLabel(good);
        showOpToast(opLabel(p.op), good);
        SFX.gate(good, ratio);
        spawnPuff(G.flockX, 1.5, 0, 14, good?0.55:1, good?0.85:0.5, good?1:0.55);
        if(G.count <= 0){ gameOver('관문에서 군단이 전멸했습니다…'); }
      }
      for(const p of g.panels){
        if(p.flash>0){
          p.flash -= dt;
          const k = 1 + Math.max(0,p.flash)*0.7;
          p.sub.scale.setScalar(k);
          p.glow.material.opacity = 0.75 + Math.max(0,p.flash)*0.8;
        }
      }
      if(z > 10){ g.active=false; g.grp.visible=false; }
    }

    // ---- 웨이브 이동/접촉
    for(const w of wavePool){
      if(!w.active) continue;
      if(!G.clash){
        w.z += move + (w.boss?0:2.2) * sdt;   // 일반 무리는 살짝 전진해 옴
      }
      if(w.boss && !w.hornPlayed && w.z > -110){ w.hornPlayed = true; SFX.horn(); }
      if(!G.clash && w.z >= -1.6){
        w.z = -1.6;
        startClash(w);
      }
    }
    if(G.clash) updateClash(sdt); // 클래시 틱도 슬로모의 영향을 받아 타격감 있게
    // ---- 월드 드레싱 스크롤
    for(const d of dashes){ d.position.z += move; if(d.position.z > 8) d.position.z -= 338; }
    for(const m of palms){ m.position.z += move*0.998; if(m.position.z > 14) m.position.z -= 270; }
    for(const m of islands){ m.position.z += move*0.55; if(m.position.z > 30) m.position.z -= 300; }
    for(const m of clouds){ m.position.z += move*0.22 + dt*0.4; if(m.position.z > 20) m.position.z -= 280; }
  }

  // 파티클 (항상)
  updatePoints(puff, dt, 3);
  updatePoints(confetti, dt, 9);
  updateDebris(dt);

  // 셰이크 감쇠
  G.shake = Math.max(0, G.shake - dt*1.6);
}

function renderFrame(){
  const t = elapsed;
  const inClash = !!G.clash;

  // ---- 군단 렌더
  const visible = Math.min(G.count, FLOCK_CAP);
  const spread = clamp(Math.sqrt(Math.max(visible,1)/46), 0.72, 1.5);
  const jitterMul = inClash ? 2.2 : 1;
  for(let i=0;i<visible;i++){
    const o = flockOffsets[i];
    const bob = Math.abs(Math.sin(t*o.speed + o.phase));
    dummy.position.set(
      clamp(G.flockX + o.x*spread + Math.sin(t*3+o.phase)*0.05*jitterMul, -4.15, 4.15),
      bob*0.14,
      o.z*spread + (inClash ? Math.sin(t*14+o.phase)*0.1 : 0)
    );
    dummy.rotation.set(0, Math.sin(t*2+o.phase)*0.12, Math.sin(t*o.speed+o.phase)*0.06);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    flock.setMatrixAt(i, dummy.matrix);
  }
  if(visible < FLOCK_CAP){
    dummy.position.set(0,-999,0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
    for(let i=visible;i<FLOCK_CAP;i++) flock.setMatrixAt(i, dummy.matrix);
  }
  flock.count = FLOCK_CAP;
  flock.instanceMatrix.needsUpdate = true;
  // 리더
  const lb = Math.abs(Math.sin(t*9));
  leader.position.set(G.flockX, lb*0.16, -0.9*spread - 0.35);
  leader.rotation.z = Math.sin(t*9)*0.05;
  leader.visible = G.count > 0;
  flock.visible = G.count > 1;

  // ---- 웨이브 렌더
  for(const w of wavePool){
    if(!w.active) continue;
    if(w.boss){
      const bm = bossMeshes[w.type];
      const hitPulse = inClash && G.clash.wave===w ? Math.sin(t*30)*0.08 : 0;
      bm.position.set(w.x, Math.abs(Math.sin(t*4))*0.3, w.z);
      bm.scale.setScalar(6.2*(1 + hitPulse) * clamp(w.count/w.startCount*0.4+0.6, 0.55, 1));
      bm.rotation.y = Math.sin(t*1.5)*0.12;
      if(w.label){
        w.label.el.textContent = fmt(w.count);
        placeLabel(w.label.el, w.x, 5.6, w.z);
      }
    }else{
      const m = w.meshes[w.type];
      const vis = Math.min(w.count, WAVE_CAP);
      const wspread = clamp(Math.sqrt(Math.max(vis,1)/40), 0.7, 1.6);
      for(let i=0;i<vis;i++){
        const o = w.offsets[i];
        const bob = Math.abs(Math.sin(t*7+o.phase));
        dummy.position.set(
          clamp(w.x + o.x*wspread, -4.15, 4.15),
          bob*0.1,
          w.z + o.z*wspread*1.15 - 1.2
        );
        dummy.rotation.set(0, Math.sin(t*2.4+o.phase)*0.15, 0);
        dummy.scale.setScalar(1.02);
        dummy.updateMatrix();
        m.setMatrixAt(i, dummy.matrix);
      }
      if(vis < WAVE_CAP){
        dummy.position.set(0,-999,0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
        for(let i=vis;i<WAVE_CAP;i++) m.setMatrixAt(i, dummy.matrix);
      }
      m.instanceMatrix.needsUpdate = true;
      if(w.label){
        w.label.el.textContent = fmt(w.count);
        placeLabel(w.label.el, w.x, 2.6 + wspread*0.6, w.z);
      }
    }
  }

  // ---- 카메라
  const targetFov = BASE_FOV + (G.speed-13)*0.55 + (inClash?4:0);
  camera.fov = lerp(camera.fov, targetFov, 0.06);
  camera.updateProjectionMatrix();
  const shx = (Math.random()-0.5)*G.shake*0.55;
  const shy = (Math.random()-0.5)*G.shake*0.4;
  camera.position.set(G.flockX*0.55 + shx, 6.8 + shy, 10.4);
  camLook.set(G.flockX*0.75, 1.1 + shy*0.5, -7);
  camera.lookAt(camLook);

  // ---- HUD / 라벨
  if(G.mode!=='title'){
    el.score.textContent = fmt(score());
    el.subScore.textContent = '거리 ' + Math.floor(G.distance) + 'm · 웨이브 ' + G.wavesCleared;
    el.flockLabel.textContent = fmt(Math.max(0,G.count));
    placeLabel(el.flockLabel, G.flockX, 2.15, 0.4);
    const toastEl = el.opToast;
    if(toastEl.classList.contains('play')){
      projV.set(G.flockX, 2.6, 0).project(camera);
      toastEl.style.left = ((projV.x*0.5+0.5)*window.innerWidth)+'px';
      toastEl.style.top = ((-projV.y*0.5+0.5)*window.innerHeight)+'px';
    }
  }else{
    el.flockLabel.style.display='none';
  }

  renderer.render(scene, camera);
}

let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastT)/1000;
  lastT = now;
  dt = clamp(dt, 0, 0.05);
  if(!FREEZE) simulate(dt);
  renderFrame();
}
requestAnimationFrame(loop);

/* ============================================================
   타이틀 화면 초기 상태
============================================================ */
if(AUTOSTART){
  startGame();
  if(SIMSEC > 0){ // 스크린샷/테스트용: N초를 즉시 시뮬레이션
    const steps = Math.round(SIMSEC*60);
    for(let i=0;i<steps;i++) simulate(1/60);
  }
}else{
  // 타이틀 뒤 배경: 군단 대기 (약간의 유휴 흔들림은 renderFrame에서 처리)
  G.count = 10;
}

/* ============================================================
   디버그 훅
============================================================ */
window.__game = {
  THREE, scene, camera, renderer,
  get state(){
    return { mode:G.mode, count:G.count, distance:Math.floor(G.distance),
      speed:+G.speed.toFixed(1), waves:G.wavesCleared, score:score(),
      clash:!!G.clash, best:G.best };
  },
  start: startGame,
  step(dt=1/60){ simulate(dt); renderFrame(); },
  setCount(n){ G.count = n; },
  spawnWave(count, z=-40, boss=false, type=0){ return spawnWave(z, {count, boss, type}); },
  spawnGate(z=-40){ spawnGate(z); },
  gameOver: ()=>gameOver('디버그 종료'),
};
console.log('[flamingo] ready');
</script>
