<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DOOMINGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0c0812;
    overflow: hidden;
    font-family: monospace;
  }
  #screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0c0812;
  }
  #fb {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: crosshair;
  }
  #menu-overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(12,8,18,0.92);
    color: #ff5e9c;
    z-index: 10;
    user-select: none;
  }
  #touch-controls {
    position: fixed; inset: 0;
    display: none;
    z-index: 5;
    pointer-events: none;
  }
  #touch-controls > * { pointer-events: auto; }
  #touch-stick {
    position: absolute; left: 24px; bottom: 24px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(255,94,156,0.15);
    border: 2px solid rgba(255,94,156,0.4);
  }
  #touch-fire {
    position: absolute; right: 24px; bottom: 24px;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: rgba(255,94,156,0.25);
    border: 2px solid rgba(255,94,156,0.5);
    color: #ff5e9c;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  #touch-weapon-cycle {
    position: absolute; right: 24px; bottom: 120px;
    width: 60px; height: 40px;
    border-radius: 8px;
    background: rgba(255,94,156,0.2);
    border: 2px solid rgba(255,94,156,0.4);
    color: #ff5e9c;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
</style>
</head>
<body>
  <div id="screen">
    <canvas id="fb" width="320" height="200"></canvas>
  </div>

  <div id="menu-overlay">
    <div id="menu-content">DOOMINGO</div>
  </div>

  <div id="touch-controls">
    <div id="touch-stick"></div>
    <div id="touch-fire">FIRE</div>
    <div id="touch-weapon-cycle">WPN</div>
  </div>

  <script type="module" src="src/main.mjs"></script>
</body>
</html>
