<!DOCTYPE html>
<html lang="ko">
<head><script>if(/\/games\/[^/]+\/$/.test(location.pathname)){const base=document.createElement('base');base.href='../';document.head.append(base);}</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파! 파! 파! · Flamingo Stadium</title><script>document.write('<link rel="stylesheet" href="../common/style.css">');</script></head>
<body><div class="wrap"><canvas id="game"></canvas><div class="bar"><a href="../index.html">← 스타디움</a><span>조작: ← → (또는 A·B 버튼) 번갈아 연타</span></div></div>
<script>document.write('<script src="../common/stadium.js"><\/script>');</script>
<script>
const { palette, drawFlamingo, drawPlayerTag, Game, sfx, text, rr, rand, clamp, lerp, slots } = STADIUM;
// ── 튜닝 상수 (specs/dig.md · [추정]값은 여기서만 조정) ──
const DEPTH = 50, STEP_PX = 7.2, SURF = 110, WATER = 470, LANE_X = [150, 370, 590, 810], TUNNEL_W = 70, SCALE = 0.6, FOOT = 34 * SCALE;
const SAFETY = 45, END_WAIT = 2.0, CALL_T = 1.2, TIMEOUT_T = 0.8, DIG_T = 0.12, DIZZY_T = 0.25, GEYSER_TOP = 60, GEYSER_T = 0.35; // 간헐천 꼭대기: 지표 위 50px. 우승 레인 HUD 라벨은 태그 옆으로 비켜 그림
const RANK_PTS = [100, 60, 30, 10], MISS_BEEP = false; // 같은 버튼 반복은 원작처럼 무음 정지 (옵션 beep 기본 OFF)
const STRATA = ['#c2905a', '#b07f4c', '#9a6b3d', '#855934', '#6e472a', '#593821'], TUNNEL = '#3a2414', BAND = (WATER - SURF) / STRATA.length;
// CPU 난이도표: 평균 입력 간격(ms) · 지터(표준편차) · 같은 키 실수율 · GO! 후 첫 입력 지연(ms)
const CPU_TABLE = { normal: { mean: 312, sd: 70, miss: 0.08, react: [400, 650] }, hard: { mean: 238, sd: 45, miss: 0.04, react: [250, 400] }, hyper: { mean: 192, sd: 25, miss: 0.015, react: [120, 200] } };
let g, P, parts, elapsed, endAt, winners, timeout;
const gauss = (m, s) => m + s * Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(6.2832 * Math.random());
const floorY = p => SURF + p.depth * STEP_PX;
const label = p => p.name + (p.human ? '' : ' CPU');

function makeP() { // 사람 1명: CPU = Hard/Normal/Hyper, 2명 이상: 남는 CPU부터 Hard→Hyper→Normal
  const sl = slots(), n = sl.filter(s => s.human).length, q = n === 1 ? ['hard', 'normal', 'hyper'] : ['hard', 'hyper', 'normal'];
  return sl.map(s => { const lvl = s.human ? null : q.shift();
    return { ...s, depth: 0, last: null, digT: 0, dizzyT: 0, flip: false, done: false, geyser: 0,
      cpu: lvl && { lvl, mult: rand(0.94, 1.06), t: rand(...CPU_TABLE[lvl].react) / 1000, mustFix: false } }; });
}
function tap(p, i, key) { // 유효 교대 입력 1회 = 깊이 +1칸. 같은 버튼 반복 = 정지(페널티·소리 없음)
  if (key === p.last) { if (MISS_BEEP && p.human) sfx.beep(220, 0.03, 'square', 0.05); return; }
  p.last = key; p.depth = Math.min(DEPTH, p.depth + 1); p.digT = DIG_T; p.flip = !p.flip;
  const fy = floorY(p), c = STRATA[clamp(Math.floor((fy - SURF) / BAND), 0, STRATA.length - 1)];
  for (let k = 0, n = 3 + (Math.random() * 3 | 0); k < n; k++) parts.push({ x: LANE_X[i] + rand(-16, 16), y: fy - 2, vx: rand(-110, 110), vy: rand(-280, -130), r: rand(3, 6), life: rand(0.35, 0.6), c });
  sfx.beep((key === 'L' ? 880 : 990) * (p.human ? 1 : 0.5), 0.03, 'square', p.human ? 0.05 : 0.012); // 좌/우 피치가 달라 교대 리듬이 귀로 들림. CPU는 한 옥타브 아래·1/4 볼륨
}
function cpuStep(p, dt) { // 목표 리듬 + 지터 + 실수 모델. 실수 뒤엔 +150ms 회복 지연, 다음 입력은 반드시 올바른 키
  const c = p.cpu, T = CPU_TABLE[c.lvl]; c.t -= dt; if (c.t > 0) return null;
  let miss = T.miss; if (c.lvl !== 'normal') miss *= elapsed < 3 ? 0.5 : elapsed > 10 ? 1.5 : 1; // 초반 집중 · 후반 피로
  const wrong = !c.mustFix && !!p.last && Math.random() < miss; c.mustFix = wrong;
  c.t += Math.max(90, gauss(T.mean, T.sd)) * c.mult / 1000 + (wrong ? 0.15 : 0); // 남은 시간 이월 → 프레임레이트 무관
  return wrong ? p.last : p.last === 'L' ? 'R' : 'L';
}
function ranks() { // 깊이 내림차순, 동률은 공동(건너뛰지 않는) 순위. 전원 0칸이면 전원 4위("아무것도 안 하면 이긴다" 방지)
  if (P.every(p => p.depth === 0)) return P.map(() => 4);
  const order = P.map((_, i) => i).sort((a, b) => P[b].depth - P[a].depth), r = []; let n = 0, prev = -1;
  order.forEach(i => { if (P[i].depth !== prev) { n++; prev = P[i].depth; } r[i] = n; }); return r;
}
function call(ctx, s) { ctx.save(); ctx.font = 'bold 46px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.strokeStyle = palette.ink; ctx.strokeText(s, g.W / 2, g.H / 2); ctx.fillStyle = palette.gold; ctx.fillText(s, g.W / 2, g.H / 2); ctx.restore(); }

g = Game({ id: 'dig', title: '파! 파! 파!', howto: ['← → 를 번갈아 눌러 땅을 파세요 (또는 각자의 A·B 액션 버튼)', '같은 버튼을 연속으로 누르면 헛삽질!', '두 버튼을 동시에 누르면 안 파집니다', '지하 우물에 먼저 닿으면 승리'], duration: 0,
  init() { P = makeP(); parts = []; elapsed = 0; endAt = null; winners = []; timeout = false; },
  update(dt) {
    elapsed += dt;
    if (endAt == null) {
      P.forEach((p, i) => {
        if (p.done) return; let L = false, R = false;
        if (p.human) { const k = g.p(i); L = k.hit('left') || k.hit('a'); R = k.hit('right') || k.hit('b'); }
        else { const key = cpuStep(p, dt); L = key === 'L'; R = key === 'R'; }
        if (L && R) { if (p.last) tap(p, i, p.last === 'L' ? 'R' : 'L'); else p.dizzyT = DIZZY_T; } else if (L || R) tap(p, i, L ? 'L' : 'R'); // 한 프레임 두 입력 = 교대 쪽 1칸만(빠른 롤 관용), 첫 입력이면 어리둥절
      });
      winners = P.filter(p => p.depth >= DEPTH); // 같은 프레임 동시 도달 = 공동 1위
      if (winners.length) { winners.forEach(p => { p.done = true; }); endAt = elapsed; sfx.good(); } // 팡파르(sfx.win/lose)는 셸 finish()가 한 번만 울림
      else if (elapsed >= SAFETY) { endAt = elapsed; timeout = true; }
    } else {
      const e = elapsed - endAt;
      for (const p of winners) { p.geyser = clamp(e / GEYSER_T, 0, 1); const top = lerp(WATER, GEYSER_TOP, p.geyser);
        if (p.geyser >= 1) for (let k = 0; k < 10; k++) if (Math.random() < 0.25) { const a = -Math.PI * (0.1 + 0.8 * k / 9); parts.push({ x: LANE_X[p.i] + Math.cos(a) * 14, y: top, vx: Math.cos(a) * 170, vy: Math.sin(a) * 220 - 60, r: rand(3, 5), life: rand(0.3, 0.5), c: palette.white }); } // 물왕관
        for (let k = 0; k < 2; k++) parts.push({ x: LANE_X[p.i] + rand(-18, 18), y: top + 4, vx: rand(-130, 130), vy: rand(-240, -40), r: rand(3, 5), life: rand(0.3, 0.6), c: palette.white }); }
      if (e >= END_WAIT) g.finish();
    }
    for (const p of P) { p.digT = Math.max(0, p.digT - dt); p.dizzyT = Math.max(0, p.dizzyT - dt); }
    for (const q of parts) { q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
    parts = parts.filter(q => q.life > 0);
  },
  draw(ctx) {
    const W = g.W, H = g.H, t = g.time;
    const sky = ctx.createLinearGradient(0, 0, 0, SURF); sky.addColorStop(0, '#8fd3ff'); sky.addColorStop(1, '#cfefff'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, SURF);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 3; i++) { const cx = (i * 330 + t * 10) % (W + 140) - 70, cy = 62 + (i % 2) * 14; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, 7); ctx.arc(cx + 18, cy - 8, 18, 0, 7); ctx.arc(cx + 38, cy, 13, 0, 7); ctx.fill(); }
    STRATA.forEach((c, b) => { ctx.fillStyle = c; ctx.fillRect(0, SURF + b * BAND, W, BAND + 1); });
    ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let k = 0; k < 40; k++) { ctx.beginPath(); ctx.ellipse((k * 233) % W, SURF + 14 + (k * 97) % (WATER - SURF - 28), 5, 3, 0, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#6cbf4a'; ctx.fillRect(0, SURF - 7, W, 9);
    ctx.fillStyle = '#2f7fd9'; ctx.fillRect(0, WATER, W, H - WATER); // 지하수
    ctx.fillStyle = '#5aa6ee'; ctx.beginPath(); ctx.moveTo(0, WATER + 14); for (let x = 0; x <= W; x += 16) ctx.lineTo(x, WATER + Math.sin(x * 0.04 + t * 3) * 3); ctx.lineTo(W, WATER + 14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; for (let k = 0; k < 8; k++) { ctx.beginPath(); ctx.ellipse((k * 137 + t * 20) % W, WATER + 32 + (k % 3) * 12, 26, 3, 0, 0, 7); ctx.fill(); }
    const e = endAt == null ? -1 : elapsed - endAt, callT = timeout ? TIMEOUT_T : CALL_T, rk = e > callT ? ranks() : null; // 콜 → 레인별 순위 → finish
    P.forEach((p, i) => {
      const x = LANE_X[i], fy = floorY(p);
      if (p.depth > 0) { ctx.fillStyle = TUNNEL; ctx.fillRect(x - TUNNEL_W / 2, SURF - 2, TUNNEL_W, fy - SURF + 2); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x - TUNNEL_W / 2, SURF - 2, 10, fy - SURF + 2); }
      rr(ctx, x - 104, SURF, 8, WATER - SURF, 4, 'rgba(0,0,0,.28)'); if (p.depth > 0) rr(ctx, x - 104, SURF, 8, (WATER - SURF) * p.depth / DEPTH, 4, p.color); // 깊이 게이지
      let cy = fy - FOOT, pose = p.dizzyT > 0 ? 'dizzy' : p.digT > 0 ? 'dig' : 'idle';
      if (p.done) { const top = lerp(WATER, GEYSER_TOP, p.geyser); rr(ctx, x - 20, top, 40, WATER - top + 20, 12, '#6fb8ff'); rr(ctx, x - 12, top + 10, 8, Math.max(0, WATER - top), 4, 'rgba(255,255,255,.45)'); cy = top - FOOT; pose = p.geyser < 1 ? 'fly' : 'jump'; if (p.geyser >= 1) { cy -= Math.abs(Math.sin(t * 9)) * 6; p.flip = Math.floor(t / 0.3) % 2 === 0; } } // 간헐천
      drawFlamingo(ctx, x, cy, SCALE, pose, t + i, p.color, { flip: p.flip });
    });
    for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2.5, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
    P.forEach((p, i) => { const x = LANE_X[i]; drawPlayerTag(ctx, p.done ? x - 72 : x, 20, i); // 우승 레인은 태그를 간헐천 왼쪽으로 // HUD는 파티클(간헐천 물방울) 위에 그림
      const hx = p.done ? x + 58 : x, hy = p.done ? 26 : 50, al = p.done ? 'left' : 'center'; // 우승 레인 라벨은 간헐천 오른쪽
      if (rk) { const n = 1 + P.filter(q => q.depth > p.depth).length, none = P.every(q => q.depth === 0); text(ctx, none ? '—' : `${n}위`, hx, hy, 20, n === 1 && !none ? palette.pinkDark : palette.ink, al); } // 셸과 같은 표준 경쟁 순위
      else text(ctx, `깊이 ${(p.depth * 0.5).toFixed(1)} m`, hx, hy - 2, 15, palette.ink, al, 'normal'); });
    if (e >= 0 && e < callT) call(ctx, timeout ? '시간 종료!' : winners.length > 1 ? `${winners.map(label).join('·')} 동시 도달!` : `${label(winners[0])} 우물 도달!`);
  },
  result() {
    const r = ranks(), none = P.every(p => p.depth === 0), scores = P.map((p, i) => none ? 0 : RANK_PTS[r[i] - 1]); // 전원 0칸 = 무승부 0점(최고기록 저장 안 됨)
    const text = timeout ? `시간 종료! 아무도 우물에 닿지 못했어요${none ? ' (무승부)' : ''}` : winners.length > 1 ? `${winners.map(label).join('·')} 동시 도달!` : `${label(winners[0])} 우물 도달! (${endAt.toFixed(2)}초)`;
    return { scores, text };
  } });
</script></body></html>
