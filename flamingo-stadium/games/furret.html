}
function divePos(p) { if (p.moveT <= 0) return [wpos(p), 1]; const q = 1 - p.moveT / DIVE; return q < .5 ? [wpos(p, p.from), 1 - q * 2] : [wpos(p), (q - .5) * 2]; } // 잠수: 출발 칸에서 가라앉고 도착 칸에서 솟는다
function drawP(ctx, p, ended, max, min) {
  const [pos, k] = divePos(p), x = pos[0], y = sy(pos[1]), jy = p.jumpT > 0 ? Math.sin(Math.PI * (1 - p.jumpT / JUMP)) * 46 : 0;
  let pose = p.stun > 0 ? 'dizzy' : p.hitT > 0 ? 'hit' : p.jumpT > 0 ? 'jump' : p.eat > 0 ? 'eat' : p.moveT > 0 ? 'run' : 'idle', fy = y - 39 - jy;
  if (ended) { pose = p.score === max ? 'fly' : p.score === min && max > min ? 'sleep' : 'idle'; if (pose === 'fly') fy -= 30 + Math.sin(g.time * 4) * 10; } // 결과: 1위(공동 포함) 날고 꼴찌는 잠
  if (jy > 0) { ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x, y + 4, 22 - jy * .15, 8, 0, 0, 7); ctx.fill(); }
  ctx.save(); ctx.translate(x, y); ctx.scale(1, Math.max(.04, k)); drawFlamingo(ctx, 0, fy - y, 1.0, pose, g.time + p.i, p.color, { flip: p.own === 'left' }); ctx.restore();
  p.tag = k > .5 ? [x + DIRS[p.own][0] * 22, Math.max(64, fy - 60)] : null;
  if (p.human && !ended && elapsed < 12 && p.score === 0 && g.state() === 'play') { // 초반 안내: 닿는 볼이 있으면 A, 내 풀밭으로 볼이 가면 방향키 꾹
    const own = balls.some(b => b.st === 'live' && (b.z > 0 ? b.to : cellOf(b)) === p.own), near = balls.some(b => inReach(wpos(p), b));
    const h = near ? 'A 버튼!' : own && p.cell !== p.own ? ARROW[p.own] + ' 꾹!' : ''; if (h) { const [hx, hy] = HUDPOS[p.i]; rr(ctx, hx + (hx < 480 ? 50 : -130), hy + 26, 80, 30, 12, palette.cream); text(ctx, h, hx + (hx < 480 ? 90 : -90), hy + 47, 16, palette.pinkDark); } } // 안내는 내 HUD 옆(무리 위 겹침 방지)
}
function drawHUD(ctx, ended, max) {
  const lead = P.filter(p => p.score === max);
  for (const p of P) { const [hx, hy] = HUDPOS[p.i]; rr(ctx, hx - 44, hy - 16, 88, 96, 12, 'rgba(58,36,48,0.5)'); drawPlayerTag(ctx, hx, hy, p.i);
    const k = 1 + Math.max(0, p.pulse) * 1.5; ctx.save(); ctx.translate(hx, hy + 42); ctx.scale(k, k); text(ctx, String(p.score), 0, 12, 34, p.color); ctx.restore();
    if (max > 0 && lead.length === 1 && lead[0] === p) text(ctx, '선두', hx, hy + 74, 13, palette.gold); }
  const tl = g.timeLeft, urgent = tl <= 10 && !ended && g.state() === 'play'; rr(ctx, 436, 8, 88, 46, 12, 'rgba(58,36,48,0.5)'); // 상단 중앙 큰 타이머, 마지막 10초 빨강 점멸
  if (!urgent || Math.floor(g.time * 4) % 2 === 0) text(ctx, ended ? '끝!' : String(Math.ceil(tl)), 480, 44, 34, urgent ? palette.red : palette.cream);
  if (caption) { ctx.globalAlpha = Math.min(1, caption.life); rr(ctx, 130, 14, 296, 32, 16, 'rgba(58,36,48,0.7)'); text(ctx, caption.s, 278, 36, 16, palette.cream); ctx.globalAlpha = 1; }
}

g = Game({ id: 'furret', title: '통통볼 플라밍고', howto: ['A 버튼으로 튀어올라 떨어진 볼을 머리로 쳐요', '내 둥지 쪽 방향키를 꾹 눌러 풀밭으로 따라가 한 번 더! (떼면 중앙)', '큰 볼일수록 고득점 1·2·3·5점 · 60초 안에 내 둥지에 많이 넣기'], duration: 60,
  init() { // 항상 4마리. CPU 난이도: 2P 보통 · 3P 보통/어려움 50:50 · 4P 어려움
    P = slots().map((s, i) => ({ ...s, own: OWN[i], cell: 'C', from: 'C', moveT: 0, jumpT: 0, hitT: 0, eat: 0, stun: 0, pulse: 0, flashG: 0, score: 0, whiff: false, hitDone: true, wait: -1, aiDir: null, lv: i === 3 || (i === 2 && Math.random() < .5) ? 'hard' : 'normal' }));
    balls = []; parts = []; pops = []; caption = null; elapsed = 0; spawnT = 0.5; nb = 0; lastSec = 99;
  },
  update(dt) {
    elapsed += dt; if (elapsed > 66) g.finish(); // 안전장치(셸 타이머가 60초에 끝냄)
    const sc = SCHED.find(s => elapsed < s[0]); spawnT -= dt;
    if (spawnT <= 0 && balls.filter(b => b.st !== 'goal').length < MAXB) { spawnT = sc[1]; const r = Math.random(); spawnBall(nb ? pickKind(sc[2]) : 0, !nb || r < .5 ? 'C' : ARMS[Math.floor((r - .5) * 8)], !nb); nb++; } // 중앙 50% · 팔 12.5%씩, 첫 볼은 정중앙
    for (const b of balls) stepBall(b, dt); balls = balls.filter(b => b.st !== 'goal' || b.t > 0);
    cand = []; for (const p of P) stepPlayer(p, dt);
    cand.sort((u, v) => u[2] - v[2]); for (const [p, b] of cand) if (!p.hitDone && !(b.lock > 0)) bump(p, b); // 같은 프레임 경합: 볼 중심에 가까운 쪽이 첫 타
    for (const q of parts) { q.vy += q.gr * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; } parts = parts.filter(q => q.life > 0);
    for (const o of pops) { o.y -= 50 * dt; o.life -= dt; } pops = pops.filter(o => o.life > 0);
    if (caption) { caption.life -= dt; if (caption.life <= 0) caption = null; }
    const s = Math.ceil(g.timeLeft); if (s !== lastSec) { lastSec = s; if (s <= 10 && s > 0) sfx.tick(); if (s === 10) say('마지막 10초!'); }
  },
  draw(ctx) {
    drawField(ctx); if (!P) return;
    const ended = g.state() === 'end', max = Math.max(...P.map(p => p.score)), min = Math.min(...P.map(p => p.score));
    const ents = [...balls.map(b => ({ y: sy(b.y), b })), ...P.map(p => ({ y: sy(divePos(p)[0][1]) + 1, p }))].sort((u, v) => u.y - v.y); // 화면 y 순으로 겹침 정리
    for (const e of ents) e.b ? drawBall(ctx, e.b) : drawP(ctx, e.p, ended, max, min);
    for (const b of balls) if (b.st === 'live' && b.z < 30) { ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, sy(b.y) - b.z, BALL[b.k].r + 3, 0, 7); ctx.stroke(); } // 새에 가려진 볼 윤곽
    for (const p of P) if (p.tag) drawPlayerTag(ctx, p.tag[0], p.tag[1], p.i); // 태그는 새 전부 그린 뒤 한 번에
    for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2.5, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; drawHUD(ctx, ended, max);
    if (ended || (g.state() === 'play' && g.timeLeft < 0.6)) { rr(ctx, 380, 230, 200, 90, 24, 'rgba(58,36,48,0.75)'); text(ctx, '끝!', 480, 294, 60, palette.gold); } // 종료 순간 큰 '끝!'(§7)
    for (const o of pops) { ctx.globalAlpha = Math.min(1, o.life * 2); text(ctx, o.s, o.x, o.y, o.size, palette.ink); text(ctx, o.s, o.x, o.y - 1.5, o.size, o.c); } ctx.globalAlpha = 1;
  },
  result() { // 동점은 같은 점수를 그대로 넘겨 셸이 공동 순위로 처리 (원작 동점 퀴즈 대신)
    const max = Math.max(...P.map(p => p.score)), w = P.filter(p => p.score === max).map(p => p.name);
    return { scores: P.map(p => p.score), text: `${w.length > 1 ? '공동 승자' : '승자'} ${w.join('·')} — 둥지에 ${max}점!` };
  } });
</script></body></html>
