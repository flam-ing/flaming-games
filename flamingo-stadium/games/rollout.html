<body><div class="wrap"><canvas id="game"></canvas><div class="bar"><a href="../index.html">← 스타디움</a><span>조작: ↑↓←→ 방향 전환 · A 버튼 회오리 설치</span></div></div>
<script>document.write('<script src="../common/stadium.js"><\/script>');</script>
<script>
const { palette, drawFlamingo, drawPlayerTag, Game, sfx, text, rr, rand, clamp, lerp, slots } = STADIUM;
// 원작 Rampage Rollout (specs/rollout.md): 탑다운 트랙 9바퀴 경주. ↑↓←→ 는 90° 방향 전환만(Snake식 자동 전진, 역방향 무시), 울타리에 닿으면 그 자리에서 정지.
// 결승선 통과 시 순위별 회오리 지급(1위 0 · 2위 1 · 3위 2 · 4위 3, 보유 상한 3) → A 버튼으로 바로 뒤에 설치, 타인이 밟으면 1.2s 정지(설치자는 영구 면역). 9바퀴째는 몸을 말아 구르기 ×1.35.
// 제한 시간 없음: 첫 완주 즉시 종료(2s 연출 뒤 finish), 180s 안전장치. [추정] 값은 전부 아래 상수.
const OX = 120, OY = 70, OW = 720, OH = 430, TW = 96, M = 14, CR = 24; // 바깥 트랙 사각 · 트랙 폭 · 캐릭터 중심 여유 · 코너 반경(시각용. 충돌은 직각 — 둥근 충돌은 90° 조작으로 못 빠져나오는 끼임을 만듦)
const IX = OX + TW, IY = OY + TW, IW = OW - 2 * TW, IH = OH - 2 * TW; // 잔디섬 216,166 528×238
const CX0 = OX + TW / 2, CX1 = OX + OW - TW / 2, CY0 = OY + TW / 2, CY1 = OY + OH - TW / 2, FX = 480; // 중심선 x 168/792 · y 118/452 · 결승선 x
const CB = [IX + IW - FX, IX + IW - FX + TW + IH, IX + IW - FX + 2 * TW + IH + IW, IX + IW - FX + 3 * TW + 2 * IH + IW], PERIM = CB[3] + TW + FX - IX; // 코너(우하·우상·좌상·좌하) 진입 거리 · 둘레 1916
const V = 270, ROLL = 1.35, LAPS = 9, STUN = 1.2, SPIN = 0.6, INV = 0.3, ACC = 0.4, CLIFE = 20, CMAX = 12, HITR = 26, LIMIT = 180, SC = 0.42; // §3~5 [추정] 상수
const DX = [1, 0, -1, 0], DY = [0, -1, 0, 1], DIRS = ['right', 'up', 'left', 'down']; // 0 R · 1 U · 2 L · 3 D = 반시계 주행 = 레그(하·우·상·좌) 순서
const LINE = [CX1, -CY0, -CX0, CY1], CEN = [-CY1, -CX1, CY0, CX0]; // 레그별: 진행축에서 본 중심선 코너 좌표 · 가로축(안쪽 +)에서 본 중심선 좌표
// CPU 모델 (§8 표): d = 코너 반응 지연 [평균, σ] s (선행 감지로 평균은 상쇄되고 σ만큼 빠르거나 늦게 꺾음 — 너무 이르면 섬, 늦으면 울타리), over = 오버런(지연 3배 → 울타리 정지) 확률/코너,
// inset = 인코스 px, dodge = 전방 120px 회오리 회피 확률, R = 뒤 R px 안에 상대가 있을 때 설치, mis = 아무 때나 설치 확률/초
const AI = { normal: { d: [.22, .08], over: .15, inset: 12, dodge: .45, R: 90, mis: .06 }, hard: { d: [.13, .04], over: .06, inset: 24, dodge: .7, R: 120, mis: .02 }, vhard: { d: [.07, .025], over: .02, inset: 32, dodge: .88, R: 150, mis: .005 } };
const CPU_LV = ['normal', 'hard', 'vhard']; // 남는 CPU 슬롯 순서대로 배정 (스펙 §5)
const gauss = (m, s) => m + s * Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(Math.PI * 2 * Math.random());
const hudX = i => 20 + i * 230;
let g, P, clouds, parts, flies, note, goal, elapsed, over, overT, winner, timeout, order;

function onTrack(x, y) { return x >= OX + M && x <= OX + OW - M && y >= OY + M && y <= OY + OH - M && !(x > IX - M && x < IX + IW + M && y > IY - M && y < IY + IH + M); } // 캐릭터 중심이 흙길 위인가
function sOf(x, y) { // 결승선부터 중심선을 따라 반시계로 잰 거리 [0, PERIM) (§4). 코너 사각은 섬 모서리 기준 각도로 보간해 끊김 없이 이어진다
  const rt = x > IX + IW, lf = x < IX, bt = y > IY + IH, tp = y < IY;
  if ((rt || lf) && (bt || tp)) { const u = rt ? x - IX - IW : IX - x, v = bt ? y - IY - IH : IY - y, k = rt ? (bt ? 0 : 1) : bt ? 3 : 2; return CB[k] + TW * (k % 2 ? Math.atan2(v, u) : Math.atan2(u, v)) / (Math.PI / 2); }
  return rt ? CB[0] + TW + IY + IH - y : tp ? CB[1] + TW + IX + IW - x : lf ? CB[2] + TW + y - IY : x >= FX ? x - FX : PERIM + x - FX;
}
function tryTurn(p, d) { // 90° 전환만: 같은 방향·역방향(180°)은 무시. 스턴 중엔 마지막 입력 1개만 버퍼
  if (d === p.dir || d === (p.dir + 2) % 4) return;
  if (p.stun > 0) { p.buf = d; return; }
  p.dir = d; p.stuck = false; if (p.human) sfx.beep(660, 0.03, 'square', 0.025);
}
function place(p) { // A 버튼 1회 = 회오리 1개, 진행 반대쪽 36px(트랙 밖이면 제자리). 설치자 본인은 영구 면역. 동시 최대 12개(오래된 것부터 소멸)
  if (p.hold <= 0 || over) return; p.hold--;
  let b = 36, x, y; do { x = p.x - DX[p.dir] * b; y = p.y - DY[p.dir] * b; } while (!onTrack(x, y) && (b -= 2) > 0); // 트랙 밖이면 트랙 안쪽으로 당김
  clouds.push({ x, y, owner: p.i, life: CLIFE, age: 0, seen: 0 }); if (clouds.length > CMAX) clouds.shift(); sfx.pop();
}
function burst(x, y, n, c, grav) { for (let k = 0; k < n; k++) parts.push({ x, y, vx: rand(-170, 170), vy: grav ? rand(-280, -80) : rand(-150, 150), life: rand(0.4, 0.9), c: c || palette.players[k % 4], g: grav, r: grav ? 4 : 3 }); }
function hitP(p) { p.stun = STUN; p.stuck = false; p.buf = -1; p.rot = 0; sfx.hit(); burst(p.x, p.y, 8, '#8f6a3a'); } // 피격: 0.6s 두 바퀴 회전 + 0.6s 정지, 해제 후 0.4s 가속
function lapDone(p) { // 결승선 정방향 통과: 출발 직후 첫 통과는 카운트 안 함 → 순위별 회오리 지급(상한 3, 초과분 소멸) → 8바퀴째 구르기 예고 → 9바퀴 골인
  if (++p.lap < 1 || p.lap <= p.maxLap) return; p.maxLap = p.lap; p.lapPop = 0.2; sfx.tick();
  const award = Math.min(p.rank - 1, 3 - p.hold);
  if (award > 0) { for (let k = 0; k < award; k++) flies.push({ x1: hudX(p.i) + 80 + (p.hold + k) * 18, t: -k * 0.08, c: p.color }); p.hold += award; sfx.good(); }
  if (p.lap === LAPS - 1) { note = { s: `${p.name} 구르기!`, life: 0.8 }; sfx.beep(660, 0.08, 'square', 0.15); setTimeout(() => sfx.beep(660, 0.08, 'square', 0.15), 110); }
  if (p.lap >= LAPS) { over = true; overT = 2; winner = p.i; goal = `${p.name} 완주!`; sfx.win(); burst(FX, CY1, 20, null, true); }
}
function humanCtl(p) { // 방향키 hit 우선, down 도 인정(홀드 지원 — 눌리는 순간 방향 확정). A/B hit = 설치
  const k = g.p(p.i); let want = -1;
  for (let d = 0; d < 4; d++) if (k.hit(DIRS[d])) want = d;
  if (want < 0) for (let d = 0; d < 4; d++) if (k.down(DIRS[d]) && d !== p.dir) want = d;
  if (want >= 0) tryTurn(p, want);
  if (k.hit('a') || k.hit('b')) place(p);
}
function sched(p, d, kind, t) { p.pend = d; p.kind = kind; p.pendT = Math.max(0.02, t); } // CPU 방향 전환 예약: kind c 코너 · l 레인 이동 · r 레그 복귀
function aiCtl(p, dt) { // §8 웨이포인트 주행: 레그(직선) k 를 인코스 레인으로 달리다 코너선을 선행 감지 → 반응 지연 뒤 90° 전환. 실수는 σ·오버런이 담당
  if (p.stun > 0) return;
  const a = AI[p.lv], k = p.leg, n = (k + 1) % 4, spd = V * p.varf * (p.roll ? ROLL : 1), lead = 0; // 지연은 코너선 도달 후 시작(§8)
  const al = p.x * DX[k] + p.y * DY[k], lat = p.x * DX[n] + p.y * DY[n], toLine = LINE[k] - a.inset * 0.6 - al; // 코너선은 중심선 코너보다 inset·0.6 안쪽
  p.laneT -= dt; if (p.laneT <= 0) p.laneOff = 0; p.laneCd -= dt;
  const tgt = clamp(CEN[k] + a.inset + p.laneOff, CEN[k] - TW / 2 + M + 2, CEN[k] + TW / 2 - M - 2), off = tgt - lat;
  if (p.pend < 0) {
    if (p.dir !== k) sched(p, k, 'r', 0.15); // 레그 방향이 아닌데 계획이 없음 → 복귀
    else if (toLine <= lead) sched(p, n, 'c', gauss(a.d[0], a.d[1]) * (Math.random() < a.over ? 2 : 1)); // 코너. 오버런이면 2배 늦게 꺾어 울타리에 박힌다
    else if (p.stuck || (Math.abs(off) > 12 && toLine > lead + 80 && p.laneCd <= 0)) sched(p, off > 0 ? n : (k + 3) % 4, 'l', gauss(a.d[0], a.d[1] / 2)); // 레인 이동(안쪽 +). 섬에 박혔으면 바깥으로 빠져나감
  } else {
    if (p.stuck) p.pendT = Math.min(p.pendT, 0.15); p.pendT -= dt; // 벽에 박힌 뒤 재출발까지 최대 150ms
    if (p.pendT <= 0) {
      const d = p.pend, kind = p.kind; p.pend = -1; tryTurn(p, d);
      if (kind === 'c') { p.leg = n; p.laneCd = 0.3; if (p.lv === 'vhard' && p.roll) place(p); } // Very Hard: 구르기 중 코너마다 소진
      else if (kind === 'l') sched(p, k, 'r', Math.abs(off) / spd + gauss(0, a.d[1] / 2)); // 목표 레인 도착 시각에 복귀
      else p.laneCd = 0.6;
    }
  }
  if (p.dir === k) for (const c of clouds) { // 전방 120px·가로 34px 안의 타인 회오리(회오리마다 1회 판정): 난이도 확률로 반대쪽 40px 레인으로 비켜 감
    if (c.owner === p.i || (c.seen & (1 << p.i))) continue;
    const fw = (c.x - p.x) * DX[k] + (c.y - p.y) * DY[k], side = (c.x - p.x) * DX[n] + (c.y - p.y) * DY[n];
    if (fw > 0 && fw < 120 && Math.abs(side) < HITR + 8) { c.seen |= 1 << p.i; if (Math.random() < a.dodge) { p.laneOff = (side > 0 ? -40 : 40) + lat - CEN[k] - a.inset; p.laneT = 0.9; p.laneCd = 0; } }
  }
  p.think -= dt; if (p.think <= 0) { p.think = 0.25; if (p.hold > 0 && (Math.random() < a.mis * 0.25 || P.some(q => q !== p && (q.x - p.x) ** 2 + (q.y - p.y) ** 2 < a.R * a.R && (q.x - p.x) * DX[p.dir] + (q.y - p.y) * DY[p.dir] < 0))) { place(p); if (p.lv === 'vhard' && p.hold === 2) p.dbl = 0.25; } } // Very Hard: 3개면 0.25s 뒤 2연속
  if (p.dbl > 0 && (p.dbl -= dt) <= 0) place(p);
}
function step(p, dt) {
  p.lapPop -= dt; p.shake -= dt; p.inv -= dt;
  if (p.stun > 0) { if (p.stun > STUN - SPIN) p.rot += 4 * Math.PI / SPIN * dt; p.stun -= dt; if (p.stun <= 0) { p.inv = INV; p.acc = 0; p.rot = 0; if (p.buf >= 0) tryTurn(p, p.buf); p.buf = -1; } return; }
  p.acc = Math.min(1, p.acc + dt / ACC); const px = p.x, ux = DX[p.dir], uy = DY[p.dir];
  if (!p.stuck) { // 1px 단위 전진 — 울타리·섬에 닿으면 그 자리에서 정지(속도 0)하고 방향키를 기다린다
    let d = V * p.varf * (p.roll ? ROLL : 1) * p.acc * dt;
    while (d > 0) { const s = Math.min(1, d); if (onTrack(p.x + ux * s, p.y + uy * s)) { p.x += ux * s; p.y += uy * s; d -= s; } else { p.stuck = true; p.shake = 0.15; sfx.beep(180, 0.06, 'square', p.human ? 0.08 : 0.03); break; } }
    if (p.roll) p.rot += 12 * dt;
    p.dustT += dt; if (p.dustT > 0.05) { p.dustT = 0; parts.push({ x: p.x - ux * 10 + rand(-4, 4), y: p.y + 6 + rand(-3, 3), vx: -ux * 40 + rand(-25, 25), vy: -uy * 40 + rand(-25, 25), life: 0.35, c: '#c9a26b', r: 3 }); }
  }
  if (p.y > IY + IH) { if (px < FX && p.x >= FX) lapDone(p); else if (px >= FX && p.x < FX) p.lap--; } // 결승선(하단 직선 x=FX) 정방향 통과 = 바퀴 +1, 역방향 −1
  p.roll = p.lap >= LAPS - 1;
}
function tickFx(dt) {
  for (const q of parts) { if (q.g) q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; } parts = parts.filter(q => q.life > 0);
  for (const f of flies) f.t += dt; flies = flies.filter(f => f.t < 0.3);
  if (note) { note.life -= dt; if (note.life <= 0) note = null; }
}
function emblem(ctx, x, y, r, c) { // 회오리 문양 엠블럼 (HUD 보유 아이콘 · 지급 연출)
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.strokeStyle = palette.white; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let k = 0; k < 24; k++) { const a = k * 0.5, rd = r * 0.15 + k * r * 0.03; ctx[k ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rd, y + Math.sin(a) * rd); } ctx.stroke();
}

g = Game({ id: 'rollout', title: '돌돌 레이스', howto: ['↑↓←→ 로 방향을 바꿔 트랙을 9바퀴 도세요', '결승선 통과 시 순위가 낮을수록 회오리를 더 받아요 (2위 1 · 3위 2 · 4위 3)', 'A 버튼: 회오리를 뒤에 놓아 상대를 멈추세요', '마지막 바퀴는 구르기로 더 빨라져요!'], duration: 0,
  init() { // 항상 4마리, 결승선 30px 앞에 트랙 폭 방향 4열(1P가 가장 안쪽). CPU는 남는 슬롯 순서대로 CPU_LV, 개체 속도 편차 ±4%
    let c = 0;
    P = slots().map((s, i) => ({ ...s, x: FX - 30, y: CY1 - 33 + i * 22, dir: 0, lap: -1, maxLap: 0, dbl: 0, prog: 0, rank: i + 1, hold: 0, stun: 0, inv: 0, acc: 1, stuck: false, roll: false, rot: 0, buf: -1, shake: 0, lapPop: 0, dustT: 0,
      varf: s.human ? 1 : rand(0.96, 1.04), lv: s.human ? '' : CPU_LV[c++], leg: 0, pend: -1, kind: '', pendT: 0, think: rand(0, 0.25), laneOff: 0, laneT: 0, laneCd: 0 }));
    clouds = []; parts = []; flies = []; note = null; goal = null; elapsed = 0; over = false; overT = 0; winner = 0; timeout = false; order = [0, 1, 2, 3];
  },
  update(dt) {
    if (over) { overT -= dt; tickFx(dt); if (overT <= 0) g.finish(); return; } // 골인 후 2s 정지 연출 (회오리·경과시간 동결)
    elapsed += dt; if (elapsed > LIMIT) { timeout = true; over = true; g.finish(); return; }
    for (const p of P) { p.human ? humanCtl(p) : aiCtl(p, dt); step(p, dt); if (over) break; } // 골인 프레임에 나머지는 즉시 정지
    if (!over) clouds = clouds.filter(c => { // 최초 접촉자 1명(슬롯 순)만 맞히고 소멸. 설치자·스턴 중·무적 중은 제외
      c.age += dt; c.life -= dt; if (c.life <= 0) return false;
      for (const p of P) if (p.i !== c.owner && p.stun <= 0 && p.inv <= 0 && (p.x - c.x) ** 2 + (p.y - c.y) ** 2 < HITR * HITR) { hitP(p); return false; }
      return true;
    });
    for (const p of P) p.prog = p.lap + sOf(p.x, p.y) / PERIM; // 진행도 = 바퀴 + 바퀴 내 거리. 순위는 매 프레임 내림차순, 동률은 슬롯 순
    order = P.map(p => p.i).sort((a, b) => P[b].prog - P[a].prog || a - b); order.forEach((pi, k) => P[pi].rank = k + 1);
    tickFx(dt);
  },
  draw(ctx) {
    // 잔디(줄무늬) → 흙길(둥근 사각) → 잔디섬 → 흰 가장자리 라인 → 울타리 말뚝(점선) → 꽃 → 체크 결승선
    ctx.fillStyle = '#5cb85c'; ctx.fillRect(0, 0, g.W, g.H); ctx.fillStyle = 'rgba(255,255,255,.07)'; for (let y = 0; y < g.H; y += 48) ctx.fillRect(0, y, g.W, 24);
    rr(ctx, OX, OY, OW, OH, CR, '#d9b27a'); rr(ctx, IX, IY, IW, IH, 12, '#7ccf6a');
    ctx.strokeStyle = palette.white; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(OX + 1.5, OY + 1.5, OW - 3, OH - 3, CR); ctx.roundRect(IX - 1.5, IY - 1.5, IW + 3, IH + 3, 12); ctx.stroke();
    ctx.save(); ctx.setLineDash([4, 20]); ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(OX - 7, OY - 7, OW + 14, OH + 14, CR + 7); ctx.roundRect(IX + 7, IY + 7, IW - 14, IH - 14, 8); ctx.stroke(); ctx.restore();
    for (let k = 0; k < 14; k++) { ctx.fillStyle = [palette.gold, palette.white, palette.pinkLight][k % 3]; ctx.beginPath(); ctx.arc(IX + 30 + (k * 137) % (IW - 60), IY + 24 + (k * 89) % (IH - 48), 3, 0, 7); ctx.fill(); }
    for (let y = IY + IH, k = 0; y < OY + OH; y += 8, k++) { ctx.fillStyle = k % 2 ? palette.white : '#222'; ctx.fillRect(FX - 8, y, 8, 8); ctx.fillStyle = k % 2 ? '#222' : palette.white; ctx.fillRect(FX, y, 8, 8); }
    if (!P) return;
    for (const c of clouds) { // 회오리: 갈색 반투명 원 4개가 나선으로 돌고(하나는 설치자 색 틴트) 흙 알갱이가 역회전. 0.2s 동안 0→1 스케일, 소멸 2s 전부터 옅어짐
      const s = Math.min(1, c.age / 0.2), al = Math.min(1, c.life / 2); ctx.save(); ctx.translate(c.x, c.y); ctx.scale(s, s);
      for (let k = 0; k < 4; k++) { const an = g.time * 5 + k * 1.6, rd = 4 + k * 3; ctx.globalAlpha = al * (k === 3 ? 0.55 : 0.35); ctx.fillStyle = k === 3 ? palette.players[c.owner] : '#b8894f'; ctx.beginPath(); ctx.arc(Math.cos(an) * rd, Math.sin(an) * rd, 18 - k * 3, 0, 7); ctx.fill(); }
      ctx.globalAlpha = al; ctx.fillStyle = '#8f6a3a'; for (let k = 0; k < 5; k++) { const an = -g.time * 7 + k * 1.26; ctx.beginPath(); ctx.arc(Math.cos(an) * 14, Math.sin(an) * 14 - 4, 2, 0, 7); ctx.fill(); } ctx.restore();
    }
    ctx.globalAlpha = 1;
    const playing = g.state() === 'play';
    [...P].sort((a, b) => a.y - b.y || a.i - b.i).forEach(p => { // 아래쪽(y 큰) 캐릭터를 나중에 그림. 포즈: 대기 idle · 주행 run · 벽 정지 idle · 구르기 ball(회전) · 피격 dizzy(회전 뒤 정지) · 종료 1위 jump/4위 sleep
      const win = over && p.rank === 1, pose = over ? (win ? 'jump' : p.rank === 4 ? 'sleep' : 'idle') : !playing ? 'idle' : p.stun > 0 ? 'dizzy' : p.roll ? 'ball' : p.stuck ? 'idle' : 'run';
      const fx = p.x + (p.shake > 0 ? rand(-2, 2) : 0), fy = p.y - (win ? Math.abs(Math.sin(g.time * 6)) * 16 : 0), face = p.dir === 1 ? -Math.PI / 2 : p.dir === 3 ? Math.PI / 2 : 0;
      drawFlamingo(ctx, fx, fy, pose === 'ball' ? 0.5 : SC, pose, g.time + p.i, p.color, { flip: p.dir === 2 && !over, rot: over ? 0 : pose === 'ball' ? p.rot : face + p.rot });
      const ty = Math.max(p.y - 34, 74), near = P.some(q => q !== p && Math.abs(q.x - p.x) < 30 && Math.abs(q.y - p.y) < 30);
      if (!over) drawPlayerTag(ctx, near ? p.x - 50 - (3 - p.i) * 14 : p.x, near ? p.y : ty, p.i); // 붙어 있으면 옆에(계단식) · HUD 아래로 클램프
      for (let k = 0; k < (p.stun > 0 ? 3 : p.hold); k++) { const an = g.time * 4 + k * 2.1; text(ctx, '★', p.x + Math.cos(an) * 12, Math.max(p.y - 46, 70) + Math.sin(an) * 4, 11, p.stun > 0 ? palette.white : palette.gold); } // 머리 위 회전 별 = 보유 회오리 / 피격 별
    });
    for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
    for (const f of flies) if (f.t >= 0) { const k = f.t / 0.3; emblem(ctx, lerp(FX, f.x1, k), lerp(CY1, 45, k) - Math.sin(k * Math.PI) * 40, 9, f.c); } // 지급 엠블럼이 결승선에서 HUD 칸으로 날아가 꽂힘
    P.forEach((p, i) => { // HUD 패널 4개(§6): 배지 · n/9 바퀴(통과 시 팝) · 순위 · 엠블럼 3칸 · 구르기 배지. 선두 패널은 금테
      const x = hudX(i); rr(ctx, x, 8, 220, 52, 12, 'rgba(255,255,255,.88)');
      if (p.rank === 1) { ctx.strokeStyle = palette.gold; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x, 8, 220, 52, 12); ctx.stroke(); }
      drawPlayerTag(ctx, x + 36, 24, i);
      ctx.save(); ctx.translate(x + 74, 30); const s = 1 + Math.max(0, p.lapPop) * 2; ctx.scale(s, s); text(ctx, `${Math.max(0, p.lap)}/${LAPS} 바퀴`, 0, 0, 17, palette.ink, 'left'); ctx.restore();
      text(ctx, `${p.rank}위`, x + 210, 30, 17, p.rank === 1 ? palette.pinkDark : palette.ink, 'right');
      for (let k = 0; k < 3; k++) { const ex = x + 80 + k * 18; if (k < p.hold) emblem(ctx, ex, 45, 7, p.color); else { ctx.strokeStyle = 'rgba(58,36,48,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, 45, 6, 0, 7); ctx.stroke(); } }
      if (p.roll) { rr(ctx, x + 146, 36, 64, 18, 9, '#FF8A3D'); text(ctx, '구르기!', x + 178, 49, 12, palette.white); }
    });
    if (note) { ctx.globalAlpha = Math.min(1, note.life * 3); text(ctx, note.s, g.W / 2, 262, 26, '#FF8A3D'); ctx.globalAlpha = 1; }
    if (g.state() === 'count') text(ctx, '준비…', g.W / 2, 330, 28, palette.ink);
    if (playing && elapsed < 0.5 && !over) text(ctx, '시작!', g.W / 2, 240, 40, palette.pinkDark);
    if (goal && playing) { ctx.save(); ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = palette.ink; ctx.strokeText(goal, g.W / 2, 305); ctx.fillStyle = palette.gold; ctx.fillText(goal, g.W / 2, 305); ctx.restore(); }
    else if (playing && elapsed < 6) text(ctx, '↑↓←→ 로 꺾고 · A 버튼으로 회오리를 뒤에!', g.W / 2, 292, 16, palette.ink);
    text(ctx, elapsed.toFixed(1).padStart(4, '0'), g.W / 2, 528, 15, palette.ink);
  },
  result() { // 순위 점수 100/60/30/10 — 골인 프레임의 진행도(바퀴 + 거리) 순, 동률은 슬롯 순
    const sc = []; order.forEach((pi, k) => sc[pi] = [100, 60, 30, 10][k]); if (timeout && Math.max(...P.map(p => p.lap)) < 1) sc.fill(0); // 아무도 한 바퀴를 못 돌면 무승부
    return { scores: sc, text: timeout ? '시간 종료!' : `${P[winner].name} 9바퀴 완주! (${elapsed.toFixed(1)}초)` };
  } });
</script></body></html>
