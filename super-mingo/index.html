<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SUPER MINGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  #touch-controls {
    position: fixed; inset: 0;
    display: none;
    pointer-events: none;
    z-index: 10;
    font-family: sans-serif;
  }
  #touch-controls.active { display: block; }
  .tc-btn {
    position: absolute;
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    font-size: 22px;
    font-weight: bold;
    -webkit-user-select: none; user-select: none;
  }
  .tc-btn.pressed { background: rgba(255,255,255,0.3); }
  #tc-left { left: 18px; bottom: 34px; width: 62px; height: 62px; border-radius: 12px; }
  #tc-right { left: 90px; bottom: 34px; width: 62px; height: 62px; border-radius: 12px; }
  #tc-a { right: 20px; bottom: 46px; width: 68px; height: 68px; }
  #tc-b { right: 96px; bottom: 20px; width: 68px; height: 68px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="384" height="216"></canvas>
  </div>
  <div id="touch-controls">
    <div class="tc-btn" id="tc-left">&#9664;</div>
    <div class="tc-btn" id="tc-right">&#9654;</div>
    <div class="tc-btn" id="tc-b">B</div>
    <div class="tc-btn" id="tc-a">A</div>
  </div>
  <script type="module" src="src/main.mjs"></script>
</body>
</html>
